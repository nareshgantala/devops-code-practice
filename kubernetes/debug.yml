apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  labels:
    app: secure-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-banking
  template:
    metadata:
      labels:
        app: web-banking
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
  selector:
    app: web-banking
