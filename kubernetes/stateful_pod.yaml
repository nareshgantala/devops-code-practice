apiVersion: v1
kind: Pod
metadata:
  name: stateful-db-pod
spec:
  containers:
  - name: db-engine
    image: alpine
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data-volume
      mountPath: /data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: database-disk